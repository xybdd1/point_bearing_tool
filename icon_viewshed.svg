<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 地面剖面（山脊） -->
  <path d="M 4 50 L 16 34 L 26 44 L 38 26 L 50 42 L 60 50 Z"
        fill="#6b7a5a" fill-opacity="0.55" stroke="#3b4a2e" stroke-width="1.2"/>
  <!-- 观察点位 -->
  <circle cx="14" cy="36" r="3.4" fill="#ff8c00" stroke="#1e1e1e" stroke-width="1"/>
  <!-- 视线扇面 -->
  <path d="M 14 36 L 44 10 L 58 30 Z" fill="#3cdc64" fill-opacity="0.35"
        stroke="#2ecc55" stroke-width="1.2" stroke-linejoin="round"/>
  <!-- 视线 -->
  <line x1="14" y1="36" x2="44" y2="10" stroke="#2ecc55" stroke-width="1.4"
        stroke-dasharray="3 2"/>
  <line x1="14" y1="36" x2="58" y2="30" stroke="#2ecc55" stroke-width="1.4"
        stroke-dasharray="3 2"/>
</svg>
