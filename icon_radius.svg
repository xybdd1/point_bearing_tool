<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- 外圈（等距圆） -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="#e31b1b" stroke-width="3"/>
  <circle cx="32" cy="32" r="24" fill="#e31b1b" fill-opacity="0.10"/>
  <!-- 半径指示线 -->
  <line x1="32" y1="32" x2="52.5" y2="19.5" stroke="#e31b1b" stroke-width="2"
        stroke-dasharray="4 3" stroke-linecap="round"/>
  <!-- 圆心 -->
  <circle cx="32" cy="32" r="4.5" fill="#ffffff" stroke="#1e1e1e" stroke-width="1.4"/>
</svg>
